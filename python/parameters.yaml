grid_parameters :
  domain_parameters :
    xL : 0.
    xR : 1.
    yL : 0.
    yR : 1.

  mesh_parameters : # Nx and Ny are the NUMBER OF POINTS, NOT CELLS
    Nx : 401 
    Ny : 401
    nGhost : 1


time_parameters : 
  end_time : 1.
  CFL_number : 0.5
  
  
scheme_choice : 2 # 1 : CLASSICAL FV UPWIND || 2 : LUMPED SUPG || 3 : "À la carte" lumped SUPG 


solution_parameters :
  simulation_choice : 5                                 # 1 : constant || 2 : constant + random noise || 3 : constant + small gaussian || 4 : checkerboard || 5 : analytical periodic
  constant : [1., 2., 3.]
  noise_range : [12, 14]                                # n1, n2 for the range written as  [-10^(-n1), -10^(-n2)] u [10^(-n2), 10^(-n1)]
  gaussian_noise : [3, 0.4, 0.43, 0.1]                  # perturbation for the pressure : parameters are epsilon the exponent of factor 0.1 for the height, the center and the radius
  checkerboard : [[1., -1.], [1., -1.], [1., -1.]]      # values for u, v and p (first is the one at (0, 0) and other of the same checkerboard)
  analytical_periodic :
    theta : 45.     # angle in degree
    lambda : 0.25
    speed : 1.
 
 
plot_parameters :
  observables : 4 # 1 : 2d Plots of solutions || 2: 1d Plots of solutions || 3: norms of the approx sol || 4: Errors with exact 
  # Common parameters
  plot_loc : "Plots/Tests/smooth_oblique_flow/45_deg/"     # "Plots/Tests/smooth_oblique_flow/0_deg/"  "Plots/Tests/random_noise/"
  # 2d and 1d plots parameters
  nb_plots : 11   # Counting the initial one ! If < 1 no gif !
  do_pdf_plot : y       # y -> yes || anything else -> no (no "" but still counted as a string)
  do_exact_pdf_plot : y
  do_gif_plot : 
  do_exact_gif_plot :
  gif_time : 1.   # en s 
  # 2d parameters
  levels : 10     # number of levels for contour 2d plots
  # 1d parameters
  section : 3     # 1 : horizontal middle || 2 : vertical middle || 3 : diagonal
